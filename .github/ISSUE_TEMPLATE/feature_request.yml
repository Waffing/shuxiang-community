name: 功能建议
description: 说明你遇到的问题和希望改善的体验。
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景遇到了什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的改进
      description: 你希望如何使用这项功能，什么结果算是解决了问题？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代办法（选填）
      description: 是否有更简单的做法，或现有功能能够部分满足需求？
