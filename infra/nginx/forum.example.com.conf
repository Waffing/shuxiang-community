log_format forum2_main '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent"';
map $request_method $forum2_write_key {
    default $binary_remote_addr;
    GET "";
    HEAD "";
    OPTIONS "";
}
map $arg_action $forum2_sensitive_key {
    default "";
    login "$binary_remote_addr:login";
    register "$binary_remote_addr:register";
    publish "$binary_remote_addr:publish";
    report "$binary_remote_addr:report";
    dmca "$binary_remote_addr:dmca";
}
limit_req_zone $forum2_write_key zone=forum2_write:10m rate=30r/m;
limit_req_zone $forum2_sensitive_key zone=forum2_sensitive:10m rate=5r/m;
map $uri $forum2_cache_control {
    default "";
    /sw.js "no-cache, no-store, must-revalidate";
    /app-update.json "no-cache, no-store, must-revalidate";
    /manifest.json "public, max-age=3600";
    ~^/protected-downloads/ "private, no-store";
    ~^/downloads/ "private, no-store";
    ~^/uploads/ "public, max-age=31536000, immutable";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name forum.example.com;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/forum.example.com/acme; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name forum.example.com;

    ssl_certificate /etc/letsencrypt/live/forum.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forum.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FORUM2_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'" always;
    add_header Cache-Control $forum2_cache_control always;
    add_header Content-Encoding $asset_encoding;
    add_header Vary "Accept-Encoding" always;
    set $asset_encoding "";

    root /www/wwwroot/forum.example.com/current/app/public;
    index index.php;
    access_log /www/wwwlogs/forum.example.com.log forum2_main;
    server_tokens off;
    client_max_body_size 64m;
    gzip on;
    gzip_vary off;
    gzip_comp_level 6;
    gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain;

    location ^~ /protected-downloads/ { internal; alias /www/wwwroot/forum.example.com/shared/downloads/; }
    location ^~ /uploads/ {
        if ($uri !~ "^/uploads/icons/[A-Za-z0-9.-]+\.webp$") { return 404; }
        root /www/wwwroot/forum.example.com/shared;
        try_files $uri =404;
    }
    location ^~ /downloads/ {
        if ($uri !~ "^/downloads/resource-forum-v[0-9]+\.[0-9]+\.[0-9]+-release\.apk$") { return 404; }
        try_files $uri =404;
    }
    location ~* \.apk$ { return 404; }
    location ~ /\. { deny all; }
    location = /sw.js { try_files $uri =404; }
    location = /app-update.json { try_files $uri =404; }
    location = /manifest.json { try_files $uri =404; }
    location = /robots.txt { rewrite ^ /seo.php last; }
    location = /sitemap.xml { rewrite ^ /seo.php last; }
    location ~ ^/(?:software|platform|category)/[^/]+/?$ { rewrite ^ /index.php last; }
    location = /assets/app.min.js {
        if ($http_accept_encoding ~* "(?:^|,)\s*br\s*(?:,|$)") { rewrite ^ /assets/app.min.js.br last; }
        try_files $uri =404;
        access_log off;
    }
    location = /assets/app.min.js.br {
        internal;
        gzip off;
        set $asset_encoding "br";
        try_files $uri =404;
        types { }
        default_type application/javascript;
        access_log off;
    }
    location = /assets/styles.min.css {
        if ($http_accept_encoding ~* "(?:^|,)\s*br\s*(?:,|$)") { rewrite ^ /assets/styles.min.css.br last; }
        try_files $uri =404;
        access_log off;
    }
    location = /assets/styles.min.css.br {
        internal;
        gzip off;
        set $asset_encoding "br";
        try_files $uri =404;
        types { }
        default_type text/css;
        access_log off;
    }
    location ~* \.(?:css|js|svg|webp|png|jpe?g|gif|ico|woff2?|ttf|br)$ { access_log off; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/(?:index|api|download|health|seo)\.php$ {
        limit_req zone=forum2_write burst=10 nodelay;
        limit_req zone=forum2_sensitive burst=5 nodelay;
        limit_req_status 429;
        try_files $uri =404;
        include /www/server/nginx/conf/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9002;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 60s;
    }
    location ~* \.php { return 404; }
}
