name: 问题反馈
description: 提交可复现的问题，帮助定位和修复。
body:
  - type: markdown
    attributes:
      value: |
        涉及权限绕过、凭证或私人数据的问题，请通过[私密漏洞报告](https://github.com/Waffing/shuxiang-community/security/advisories/new)提交。
  - type: textarea
    id: environment
    attributes:
      label: 版本与环境
      description: 填写提交或版本、部署方式，以及与问题有关的浏览器、系统或运行时版本。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 从哪个页面或命令开始，依次执行什么操作？请给出最短复现路径。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望出现什么结果？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际出现了什么？可附已脱敏的错误输出或截图。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容检查
      options:
        - label: 我已确认正文、日志和截图不含密码、Token、私钥、完整 .env 或真实用户数据。
          required: true
